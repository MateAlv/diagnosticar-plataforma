# The whole platform on one instance, for the copy in AWS (docs/CLOUD_DEPLOY.md,
# infra/aws/README.md). Lives on the instance as /opt/diagnosticar/docker-compose.yml,
# with a .env that diagnosticar.sh writes from SSM on every deploy.
#
# Derived from docker-compose.yml and docker-compose.staging.yml, minus Traefik
# and the tunnels to brainy: Caddy terminates TLS, and the extractor and the
# model run here, on the CPU.
#
#   caddy ─┬─ /api/*        backend ─▶ db, genes.db (read-only)
#          ├─ /hpo-api/*    hpo-recognizer   (prefix stripped)
#          ├─ /genphenai/*  model            (prefix stripped)
#          └─ everything    frontend
#
# Each image has its own tag (BACKEND_TAG, FRONTEND_TAG, RECOGNIZER_TAG,
# MODEL_TAG), moved by the GitHub workflow of the repository that builds it
# (docs/AWS_CICD.md); one that is unset falls back to IMAGE_TAG, the set built
# by hand with infra/aws/scripts/push-images.sh.
#
# Only caddy publishes ports. The question agent is left out: its repository is
# not reachable from this deployment, and the backend switches the feature off
# when QUESTION_AGENT_URL is empty.
#
# Memory: on a 2 GB t3.small the stack measured ~1.05 GB at rest (staging,
# 2026-09). Each service has a ceiling, and if the host still runs short the
# kernel picks the extractor first and Postgres last (oom_score_adj).

name: diagnosticar

networks:
  edge:
    ipam:
      config:
        # Dynamic addresses come from the upper half, so the fixed one below
        # can never be handed to another container.
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

volumes:
  postgres_data:
  recognizer_state:
  caddy_data:
  caddy_config:

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates. Losing them means asking Let's Encrypt again, and
      # it rate-limits repeated issuance for the same name.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        # The extractor believes X-Forwarded-For only from this address
        # (TRUSTED_PROXIES). Fixed, so it cannot go stale on a restart.
        ipv4_address: 172.30.0.10
    mem_limit: 96m
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: diagnosticar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: diagnosticar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagnosticar -d diagnosticar"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [edge]
    mem_limit: 256m
    oom_score_adj: -500

  backend:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/diagnosticar-backend:${BACKEND_TAG:-${IMAGE_TAG:?set IMAGE_TAG}}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      # The password is hex (make-secrets.sh), so it needs no URL escaping.
      DATABASE_URL: postgres://diagnosticar:${POSTGRES_PASSWORD}@db:5432/diagnosticar
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      # RS256, so the extractor can verify a session with the public half.
      JWT_ACCESS_PRIVATE_KEY: ${JWT_ACCESS_PRIVATE_KEY:?set JWT_ACCESS_PRIVATE_KEY}
      JWT_ACCESS_PUBLIC_KEY: ${JWT_ACCESS_PUBLIC_KEY:?set JWT_ACCESS_PUBLIC_KEY}
      JWT_ACCEPT_LEGACY_HS256: "false"
      FRONTEND_URL: https://${DOMAIN}
      BACKEND_URL: https://${DOMAIN}
      GENE_PROFILES_DB_PATH: /app/data/genes.db
      # No SMTP and no Google sign-in: no test run can email anyone.
      QUESTION_AGENT_URL: ""
    volumes:
      - ./data/genes.db:/app/data/genes.db:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [edge]
    mem_limit: 256m

  frontend:
    # NEXT_PUBLIC_* are compiled in: push-images.sh builds this image for
    # https://${DOMAIN}, and only for it.
    image: ${ECR_REGISTRY}/diagnosticar-frontend:${FRONTEND_TAG:-${IMAGE_TAG}}
    restart: unless-stopped
    init: true
    environment:
      BACKEND_API_URL: http://backend:4000/api
    depends_on:
      - backend
    networks: [edge]
    mem_limit: 256m

  hpo-recognizer:
    image: ${ECR_REGISTRY}/diagnosticar-hpo-recognizer:${RECOGNIZER_TAG:-${IMAGE_TAG}}
    restart: unless-stopped
    init: true
    environment:
      USE_RECOGNIZER: "true"
      # claude-cli: Mate's Claude subscription token, as staging; anthropic: an
      # API key (docs/LLM_EN_LA_COPIA_AWS.md). Set by Terraform.
      RECOGNIZER_PROVIDER: ${RECOGNIZER_PROVIDER:-claude-cli}
      RECOGNIZER_MODEL: ${RECOGNIZER_MODEL:-claude-opus-5}
      # Only the one the provider uses is read. Empty until it is in SSM:
      # /healthz then reports extract_hpo.ready false with the reason, and
      # search keeps working.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: https://${DOMAIN}
      # The incumbent extractor needs a GPU and Ollama; off.
      ENABLE_SYMPTOM_EXTRACTION: "false"
      # Never keep clinical text.
      STORE_REQUESTS: "false"
      CACHE_ENABLED: "false"
      # Every extraction costs money: no session, 401.
      REQUIRE_AUTH: "true"
      JWT_PUBLIC_KEY: ${JWT_ACCESS_PUBLIC_KEY}
      TRUSTED_PROXIES: 172.30.0.10
      RATE_LIMIT_PER_MINUTE: "10"
      MAX_CONCURRENT_EXTRACTIONS: "2"
      USER_EXTRACTIONS_PER_HOUR: ${USER_EXTRACTIONS_PER_HOUR:-20}
      USER_EXTRACTIONS_PER_DAY: ${USER_EXTRACTIONS_PER_DAY:-60}
      # The ceiling on what the site may spend: of the subscription (staging's
      # 40 per 5 hours) or of an API key's weekly budget (main/ssm.tf).
      GLOBAL_EXTRACTIONS_PER_WEEK: ${GLOBAL_EXTRACTIONS_PER_WEEK:?set GLOBAL_EXTRACTIONS_PER_WEEK}
      GLOBAL_EXTRACTIONS_PER_5H: ${GLOBAL_EXTRACTIONS_PER_5H:?set GLOBAL_EXTRACTIONS_PER_5H}
      # On a volume, so a redeploy does not hand out a fresh week.
      EXTRACTION_BUDGET_STATE: /var/lib/recognizer/budget.json
    volumes:
      - recognizer_state:/var/lib/recognizer
    networks: [edge]
    # ~465 MiB at rest (the ClinLinker encoder); the rest is for peaks.
    mem_limit: 1g
    oom_score_adj: 500

  model:
    image: ${ECR_REGISTRY}/diagnosticar-model:${MODEL_TAG:-${IMAGE_TAG}}
    restart: unless-stopped
    init: true
    environment:
      CORS_ORIGINS: https://${DOMAIN}
    networks: [edge]
    mem_limit: 384m

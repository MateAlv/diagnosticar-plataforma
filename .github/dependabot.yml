version: 2

# Diagnostic.ar holds clinical data, so dependency drift is a security concern
# rather than housekeeping. Security fixes are never grouped or delayed:
# Dependabot opens those separately and immediately, whatever this file says.
#
# Routine updates are cheap to review and expensive to test: every pull
# request runs the whole CI suite, and every push to main used to make
# Dependabot rebase its open PRs and run it again — up to eight times for one
# PR, 39% of the account's Actions minutes in September 2026. So routine
# updates arrive once a month, one grouped PR per ecosystem, and are not
# rebased on their own; "Update branch" does that once, right before merging.
updates:
  # Frontend and backend in one pull request: each pull request costs a full
  # CI run (about 22 minutes), and on 2026-10-01 four npm PRs cost 100.
  - package-ecosystem: npm
    directories: [/frontend, /backend]
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions are upgraded deliberately, never as a routine PR: each
      # one arrives as its own pull request per directory, outside the group,
      # and costs a full CI run (TypeScript 7 opened two on 2026-10-02, both
      # failing). Next's changes the standalone layout the Dockerfile depends
      # on; @types/node follows the Node the images run (22). Security updates
      # are not affected by this list.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # 1.1.23 stopped the question panel's bottom sheet on a phone from moving
      # keyboard focus to «Probar de nuevo» after a failed round (four E2E tests
      # in questions.spec.ts). Held at 1.1.15 until that is fixed on our side.
      - dependency-name: "@radix-ui/react-dialog"

  - package-ecosystem: docker
    directories: [/frontend, /backend]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      base-images:
        patterns: ["*"]

  # A compromised third-party action runs with repository credentials.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]

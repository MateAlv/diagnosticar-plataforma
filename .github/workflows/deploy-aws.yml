name: Deploy to AWS

# A push to main that touches the backend or the frontend builds both images,
# pushes them to the AWS copy's ECR and redeploys it; if the copy then fails
# its smoke test, the previous images go back. docs/AWS_CICD.md has the whole
# picture (diagnostic.ar-api and spanish-symptoms-recognizer deploy the model
# and the extractor the same way).
#
# Off until the repository secret AWS_DEPLOY_ROLE_ARN exists, so merging this
# file changes nothing by itself. No AWS key is stored here: GitHub signs in
# with OIDC, as a role that only main of this repository can assume.
#
# Not a substitute for ci.yml: what reaches main already passed it as a pull
# request. Production and staging on nodo0 are untouched by this.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-aws.yml"
      - ".github/scripts/aws-deploy.sh"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time per repository, and never cancelled halfway.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  # Secrets cannot be read in a job's `if`, so a first job says whether
  # AWS_DEPLOY_ROLE_ARN is set; without it the deploy is skipped, not failed.
  configured:
    runs-on: ubuntu-latest
    outputs:
      yes: ${{ steps.check.outputs.yes }}
    steps:
      - id: check
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "::notice::AWS_DEPLOY_ROLE_ARN is not set; not deploying."; fi

  deploy:
    needs: configured
    if: needs.configured.outputs.yes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # The account id is not a credential, but it stays out of the logs: it is
      # in the role ARN and in every ECR image name.
      - name: Mask the AWS account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - id: target
        run: |
          set -euo pipefail
          for k in DOMAIN ECR_REGISTRY PUBLIC_URL; do
            echo "$(echo "$k" | tr '[:upper:]' '[:lower:]')=$(aws ssm get-parameter --name "/diagnosticar-ci/$k" --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          done
          echo "tag=app-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          provenance: false
          tags: ${{ steps.target.outputs.ecr_registry }}/diagnosticar-backend:${{ steps.target.outputs.tag }}
          cache-from: type=gha,scope=aws-backend
          cache-to: type=gha,scope=aws-backend,mode=max
          build-args: |
            RELEASE_VERSION=${{ steps.target.outputs.tag }}
            RELEASE_COMMIT=${{ github.sha }}
            RELEASE_BUILT_AT=${{ steps.target.outputs.built_at }}

      # NEXT_PUBLIC_* are compiled into the bundle, so this image is built for
      # the AWS copy's own domain, read from SSM, and serves nowhere else.
      - name: Build and push the frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: false
          tags: ${{ steps.target.outputs.ecr_registry }}/diagnosticar-frontend:${{ steps.target.outputs.tag }}
          cache-from: type=gha,scope=aws-frontend
          cache-to: type=gha,scope=aws-frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ steps.target.outputs.domain }}/api
            NEXT_PUBLIC_API_BASE_URL=https://${{ steps.target.outputs.domain }}/api
            NEXT_PUBLIC_HPO_API_URL=https://${{ steps.target.outputs.domain }}/hpo-api
            NEXT_PUBLIC_GENPHENAI_URL=https://${{ steps.target.outputs.domain }}/genphenai

      - name: Deploy
        id: deploy
        run: |
          .github/scripts/aws-deploy.sh deploy \
            BACKEND_TAG=${{ steps.target.outputs.tag }} FRONTEND_TAG=${{ steps.target.outputs.tag }}

      - name: Smoke test
        env:
          SMOKE_HEALTH_PATH: /api/health
        run: |
          .github/scripts/aws-deploy.sh check web
          ops/smoke.sh "${{ steps.target.outputs.public_url }}" "${{ steps.target.outputs.public_url }}"

      # Only once tags have moved: a failed build leaves the copy as it was.
      - name: Roll back
        if: failure() && steps.deploy.outcome != 'skipped'
        run: .github/scripts/aws-deploy.sh rollback

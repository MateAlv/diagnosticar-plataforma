name: Release

# A version tag is the only trigger, pushed once `make ci` passed locally and
# main holds the version to ship. One run tests it again (CI), then builds,
# tests and scans every image and publishes it to GHCR under the tag:
#
#   CI ──► backend · frontend ×2 · hpo-recognizer · model · question-agent ──► GHCR
#                                                                               │
#                         nodo0: ops/deploy.sh, every 5 minutes from cron ◄─────┘
#
# The nodes never build and nothing here reaches into them: nodo0 pulls the
# tag once every image it runs carries it, so it only ever deploys a release
# that passed CI and every scan, and a half-published one (a job failed) is
# never deployed. Re-run the failed jobs, or fix forward with the next tag.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # The same suite `make ci` runs, minus the image builds, which the jobs below
  # do for real. Nothing is built until it passes.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & publish ${{ matrix.workspace }} (${{ matrix.environment }})
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Without this, one image failing cancels the other mid-push and the
      # release is left half-published — the frontend on the registry and the
      # backend absent, or the reverse.
      fail-fast: false
      matrix:
        include:
          # `environment` is the only knob. The image name is derived from it,
          # so a production image can never be published under a staging name
          # or the reverse — the two cannot drift by editing one line.
          #
          # The backend reads every URL from .env at runtime, so one image
          # serves both environments and carries no environment in its name.
          - workspace: backend
            environment: production
          # The frontend does not: NEXT_PUBLIC_* values are compiled into the
          # client bundle at build time, so an image built for production posts
          # to production's API no matter what the node's .env says. Each
          # environment therefore needs its own image, not its own config.
          - workspace: frontend
            environment: production
          - workspace: frontend
            environment: staging

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything environment-specific is derived here, from matrix.environment
      # alone: the image name and the four public URLs compiled into the bundle.
      # Deriving rather than listing them means a staging build cannot be
      # published under the production name by editing one line in the matrix.
      - id: env
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          WORKSPACE: ${{ matrix.workspace }}
          PROD_API: ${{ vars.NEXT_PUBLIC_API_URL }}
          PROD_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          PROD_HPO: ${{ vars.NEXT_PUBLIC_HPO_API_URL }}
          PROD_GENPHEN: ${{ vars.NEXT_PUBLIC_GENPHENAI_URL }}
          STG_API: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
          STG_API_BASE: ${{ vars.STAGING_NEXT_PUBLIC_API_BASE_URL }}
          STG_HPO: ${{ vars.STAGING_NEXT_PUBLIC_HPO_API_URL }}
          STG_GENPHEN: ${{ vars.STAGING_NEXT_PUBLIC_GENPHENAI_URL }}
        run: |
          set -euo pipefail

          # The backend is environment-agnostic, so it keeps a bare name. Only
          # images whose content differs per environment get a suffix.
          if [ "$WORKSPACE" = "backend" ]; then
            image="diagnosticar-backend"
          elif [ "$ENVIRONMENT" = "production" ]; then
            image="diagnosticar-frontend"
          else
            image="diagnosticar-frontend-${ENVIRONMENT}"
          fi

          if [ "$ENVIRONMENT" = "staging" ]; then
            api="$STG_API"; api_base="$STG_API_BASE"; hpo="$STG_HPO"; genphen="$STG_GENPHEN"
          else
            api="$PROD_API"; api_base="$PROD_API_BASE"; hpo="$PROD_HPO"; genphen="$PROD_GENPHEN"
          fi

          # A frontend built with the wrong environment's URLs is silently
          # wrong: it starts, serves, and posts every request to the other
          # environment's API. Refuse to build rather than publish that.
          if [ "$WORKSPACE" = "frontend" ]; then
            for v in "$api" "$api_base" "$hpo" "$genphen"; do
              if [ -z "$v" ]; then
                echo "::error::Public URL variables for '$ENVIRONMENT' are not set."
                exit 1
              fi
            done
            case "$ENVIRONMENT:$api" in
              staging:*staging.*) ;;
              production:*staging.*)
                echo "::error::Production build resolved a staging URL: $api"
                exit 1 ;;
              staging:*)
                echo "::error::Staging build resolved a non-staging URL: $api"
                exit 1 ;;
            esac
          fi

          {
            echo "image=$image"
            echo "api=$api"
            echo "api_base=$api_base"
            echo "hpo=$hpo"
            echo "genphen=$genphen"
          } >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT image=$image api=$api"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ steps.env.outputs.image }}
          tags: |
            # ops/deploy.sh and ops/staging.sh pass the git tag verbatim
            # ("v0.1.0"), but {{version}} strips the leading v and publishes
            # "0.1.0". Without the raw tag below, every pull on the node 404s on
            # an image that was built and published perfectly.
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Build into the local daemon first. Pushing before the scan would put a
      # vulnerable image on the registry and only then fail the job, leaving a
      # tag that nodo0 could pull.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.workspace }}
          push: false
          load: true
          tags: ${{ steps.env.outputs.image }}:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.workspace }}-${{ matrix.environment }}
          # NEXT_PUBLIC_* values are baked into the client bundle at build time,
          # so the public URLs must be supplied here, not at container start.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.env.outputs.api }}
            NEXT_PUBLIC_API_BASE_URL=${{ steps.env.outputs.api_base }}
            NEXT_PUBLIC_HPO_API_URL=${{ steps.env.outputs.hpo }}
            NEXT_PUBLIC_GENPHENAI_URL=${{ steps.env.outputs.genphen }}
            RELEASE_VERSION=${{ github.ref_name }}
            RELEASE_COMMIT=${{ github.sha }}
            RELEASE_BUILT_AT=${{ steps.stamp.outputs.built_at }}

      - name: Scan the candidate image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.env.outputs.image }}:candidate
          format: table
          exit-code: "1"
          ignore-unfixed: true
          # Matches the CI gate. Releasing at a looser threshold than CI would
          # let a HIGH that blocked every pull request ship in a release.
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Assert the image does not run as root
        run: |
          user=$(docker image inspect ${{ steps.env.outputs.image }}:candidate --format '{{.Config.User}}')
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::${{ steps.env.outputs.image }} runs as root; add a USER directive to its Dockerfile."
            exit 1
          fi
          echo "ok — runs as $user"

      # Only now, with a scanned image, publish it. Re-running the build is
      # free: every layer is already in the local cache.
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.workspace }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.workspace }}-${{ matrix.environment }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.env.outputs.api }}
            NEXT_PUBLIC_API_BASE_URL=${{ steps.env.outputs.api_base }}
            NEXT_PUBLIC_HPO_API_URL=${{ steps.env.outputs.hpo }}
            NEXT_PUBLIC_GENPHENAI_URL=${{ steps.env.outputs.genphen }}
            RELEASE_VERSION=${{ github.ref_name }}
            RELEASE_COMMIT=${{ github.sha }}
            RELEASE_BUILT_AT=${{ steps.stamp.outputs.built_at }}


  # --------------------------------------------------------------------------
  # Three images built from other private repositories, at the commits pinned
  # in .github/recognizer.env and .github/question-agent.env, so a release tag
  # names one build of each exactly as it does the backend and frontend.
  # Published from this repository, not from diagnostic.ar-api, so the packages
  # are linked here and the node's pull account (a collaborator on this
  # repository) reads them like the others.
  #
  # Each is also tagged by the commits it was built from (`source` below). A
  # release whose pins did not move adds its version tags to that image instead
  # of building it again: the same bytes, already tested and scanned, in
  # seconds instead of up to 20 minutes of Actions time. Moving a pin builds.
  # --------------------------------------------------------------------------

  # The HPO gateway with the Spanish symptom recognizer serving /extract-hpo,
  # run by staging on nodo0 as hpo-recognizer. Its Dockerfile copies all of
  # the API's services/, so any API commit can change it.
  publish-recognizer:
    name: Build & publish hpo-recognizer
    needs: ci
    runs-on: ubuntu-latest
    # A cold build takes ~20 minutes; without a limit a hang runs for six hours.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: diagnosticar-hpo-recognizer
    steps:
      - uses: actions/checkout@v7

      - id: pins
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . .github/recognizer.env
          for v in GATEWAY_COMMIT RECOGNIZER_COMMIT; do
            if ! printf '%s' "${!v}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::$v in .github/recognizer.env must be a full commit SHA, got '${!v}'."
              exit 1
            fi
          done
          source="api-${GATEWAY_COMMIT::12}-recognizer-${RECOGNIZER_COMMIT::12}"
          {
            echo "api_ref=$GATEWAY_COMMIT"
            echo "recognizer_ref=$RECOGNIZER_COMMIT"
            echo "source=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE:$source"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.revision.api=${{ steps.pins.outputs.api_ref }}
            org.opencontainers.image.revision.recognizer=${{ steps.pins.outputs.recognizer_ref }}

      - id: reuse
        name: Reuse the image built from these commits
        env:
          SOURCE: ${{ steps.pins.outputs.source }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: .github/scripts/reuse-image.sh

      - name: Fetch the source
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/checkout@v7
        with:
          repository: MateAlv/diagnostic.ar-api
          ref: ${{ steps.pins.outputs.api_ref }}
          ssh-key: ${{ secrets.API_DEPLOY_KEY }}
          path: api

      - if: steps.reuse.outputs.reused != 'true'
        uses: actions/checkout@v7
        with:
          repository: MateAlv/spanish-symptoms-recognizer
          ref: ${{ steps.pins.outputs.recognizer_ref }}
          ssh-key: ${{ secrets.RECOGNIZER_DEPLOY_KEY }}
          path: recognizer

      # The extractor's HPO embeddings come ready made: a diagnostic.ar-model
      # release pinned in the API's services/api-gateway/embeddings.lock, which
      # the Dockerfile reads from embeddings-dist/. A deploy key cannot download
      # release assets, so this uses the same read-only token as the model.
      - name: Fetch the pinned HPO embeddings
        if: steps.reuse.outputs.reused != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MODEL_RELEASE_TOKEN }}
        run: api/services/api-gateway/fetch_embeddings.sh

      # CPU torch, a 485 MB encoder and the HPO embeddings make a ~3 GB image;
      # building, loading it for the scan and caching it overruns the runner's
      # default free space.
      - name: Free runner disk
        if: steps.reuse.outputs.reused != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/services/api-gateway/Dockerfile.recognizer
          build-contexts: recognizer=./recognizer
          push: false
          load: true
          tags: ${{ env.IMAGE }}:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hpo-recognizer
          cache-to: type=gha,scope=hpo-recognizer,mode=max

      # Both suites run offline inside the image: this is the one environment
      # where the gateway's and the recognizer's dependencies have to agree.
      - name: Test inside the image
        if: steps.reuse.outputs.reused != 'true'
        run: |
          docker run --rm -e PYTHONPATH=/app/services/api-gateway:/app:/opt/recognizer \
            -w /app/services/api-gateway ${{ env.IMAGE }}:candidate \
            python -m pytest tests/ -q -p no:cacheprovider
          docker run --rm -w /opt/recognizer ${{ env.IMAGE }}:candidate \
            python -m pytest symptoms_recognizer/tests/ -q -p no:cacheprovider

      - name: Scan the candidate image
        if: steps.reuse.outputs.reused != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:candidate
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Assert the image does not run as root
        if: steps.reuse.outputs.reused != 'true'
        run: |
          user=$(docker image inspect ${{ env.IMAGE }}:candidate --format '{{.Config.User}}')
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::${{ env.IMAGE }} runs as root."
            exit 1
          fi
          echo "ok — runs as $user"

      - name: Push
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/services/api-gateway/Dockerfile.recognizer
          build-contexts: recognizer=./recognizer
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.pins.outputs.source }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hpo-recognizer

  # GenPhenAI with its model, run by staging as `model`. Built from the API's
  # services/genphenai alone, so only GATEWAY_COMMIT names it.
  publish-model:
    name: Build & publish model
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: diagnosticar-model
    steps:
      - uses: actions/checkout@v7

      - id: pins
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . .github/recognizer.env
          if ! printf '%s' "$GATEWAY_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::GATEWAY_COMMIT in .github/recognizer.env must be a full commit SHA, got '$GATEWAY_COMMIT'."
            exit 1
          fi
          {
            echo "api_ref=$GATEWAY_COMMIT"
            echo "source=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE:api-${GATEWAY_COMMIT::12}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.revision.api=${{ steps.pins.outputs.api_ref }}

      - id: reuse
        name: Reuse the image built from this commit
        env:
          SOURCE: ${{ steps.pins.outputs.source }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: .github/scripts/reuse-image.sh

      - name: Fetch the source
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/checkout@v7
        with:
          repository: MateAlv/diagnostic.ar-api
          ref: ${{ steps.pins.outputs.api_ref }}
          ssh-key: ${{ secrets.API_DEPLOY_KEY }}
          path: api

      # The model is a release of diagnostic.ar-model, pinned by tag and
      # sha256 in the API's model.lock; the script refuses any other file.
      # Deploy keys only reach git, not release assets, hence the token: a
      # classic token of diagnosticar-fiuba, a collaborator on that repo.
      - name: Fetch the pinned model
        if: steps.reuse.outputs.reused != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MODEL_RELEASE_TOKEN }}
        run: api/services/genphenai/fetch_model.sh

      - name: Build
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/services/genphenai/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=model
          cache-to: type=gha,scope=model,mode=max

      # The tests compare three clinical cases with rankings captured from
      # production, so a wrong or corrupted model fails here, before it ships.
      - name: Test inside the image
        if: steps.reuse.outputs.reused != 'true'
        run: |
          docker run --rm -v "$PWD/api/services/genphenai/tests:/app/tests:ro" ${{ env.IMAGE }}:candidate \
            sh -c "pip install -q --user pytest==8.3.2 httpx==0.28.1 && python -m pytest /app/tests -q -p no:cacheprovider"

      - name: Scan the candidate image
        if: steps.reuse.outputs.reused != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:candidate
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Assert the image does not run as root
        if: steps.reuse.outputs.reused != 'true'
        run: |
          user=$(docker image inspect ${{ env.IMAGE }}:candidate --format '{{.Config.User}}')
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::${{ env.IMAGE }} runs as root."
            exit 1
          fi
          echo "ok — runs as $user"

      - name: Push
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/services/genphenai/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.pins.outputs.source }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=model

  # The follow-up question agent, run by staging as question-agent. The
  # Dockerfile is the API's services/question-agent/Dockerfile at
  # GATEWAY_COMMIT; the agent's code, from a teammate's private repository
  # pinned in .github/question-agent.env, is its `agent` build context, read
  # with the read-only deploy key its owner added.
  publish-question-agent:
    name: Build & publish question-agent
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: diagnosticar-question-agent
    steps:
      - uses: actions/checkout@v7

      - id: pins
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . .github/question-agent.env
          # shellcheck disable=SC1091
          . .github/recognizer.env
          for v in QUESTION_AGENT_COMMIT GATEWAY_COMMIT; do
            if ! printf '%s' "${!v}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::$v must be a full commit SHA, got '${!v}'."
              exit 1
            fi
          done
          if ! printf '%s' "$QUESTION_AGENT_REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::QUESTION_AGENT_REPO in .github/question-agent.env must be owner/name, got '$QUESTION_AGENT_REPO'."
            exit 1
          fi
          source="api-${GATEWAY_COMMIT::12}-agent-${QUESTION_AGENT_COMMIT::12}"
          {
            echo "api_ref=$GATEWAY_COMMIT"
            echo "agent_repo=$QUESTION_AGENT_REPO"
            echo "agent_ref=$QUESTION_AGENT_COMMIT"
            echo "source=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE:$source"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.revision.api=${{ steps.pins.outputs.api_ref }}
            org.opencontainers.image.revision.question-agent=${{ steps.pins.outputs.agent_ref }}

      - id: reuse
        name: Reuse the image built from these commits
        env:
          SOURCE: ${{ steps.pins.outputs.source }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: .github/scripts/reuse-image.sh

      - name: Fetch the source
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/checkout@v7
        with:
          repository: MateAlv/diagnostic.ar-api
          ref: ${{ steps.pins.outputs.api_ref }}
          ssh-key: ${{ secrets.API_DEPLOY_KEY }}
          path: api

      - if: steps.reuse.outputs.reused != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.agent_repo }}
          ref: ${{ steps.pins.outputs.agent_ref }}
          ssh-key: ${{ secrets.QUESTION_AGENT_DEPLOY_KEY }}
          path: agent

      - name: Build
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/services/question-agent/Dockerfile
          build-contexts: agent=./agent
          push: false
          load: true
          tags: ${{ env.IMAGE }}:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=question-agent
          cache-to: type=gha,scope=question-agent,mode=max

      # pytest is a dev dependency and stays out of the runtime image, so it is
      # installed for this run only. docs/ holds the contract example some tests
      # validate; without it they skip. Tests marked `live` call a real LLM or
      # model and need secrets this job does not have.
      - name: Test inside the image
        if: steps.reuse.outputs.reused != 'true'
        run: |
          docker run --rm -e HOME=/tmp -v "$PWD/agent/tests:/tmp/tests:ro" -v "$PWD/agent/docs:/tmp/docs:ro" \
            ${{ env.IMAGE }}:candidate \
            sh -c "pip install -q --user pytest==8.3.2 && python -m pytest /tmp/tests -q -p no:cacheprovider -m 'not live'"

      - name: Scan the candidate image
        if: steps.reuse.outputs.reused != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:candidate
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Assert the image does not run as root
        if: steps.reuse.outputs.reused != 'true'
        run: |
          user=$(docker image inspect ${{ env.IMAGE }}:candidate --format '{{.Config.User}}')
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::${{ env.IMAGE }} runs as root."
            exit 1
          fi
          echo "ok — runs as $user"

      - name: Push
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/services/question-agent/Dockerfile
          build-contexts: agent=./agent
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.pins.outputs.source }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=question-agent

name: Release

# Publishes immutable images to GHCR on a version tag. The nodes never run a
# build: nodo0 pulls a digest that CI already tested, so a deploy cannot pick up
# a half-finished commit and there is always a previous digest to roll back to.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to release
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & publish ${{ matrix.workspace }}${{ matrix.suffix }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Without this, one image failing cancels the other mid-push and the
      # release is left half-published — the frontend on the registry and the
      # backend absent, or the reverse.
      fail-fast: false
      matrix:
        include:
          # The backend reads every URL from .env at runtime, so one image
          # serves both environments.
          - workspace: backend
            image: diagnosticar-backend
            suffix: ""
            env_prefix: ""
          # The frontend does not: NEXT_PUBLIC_* values are compiled into the
          # client bundle at build time, so an image built for production
          # posts to production's API no matter what the node's .env says.
          # Staging therefore needs its own image rather than its own config.
          - workspace: frontend
            image: diagnosticar-frontend
            suffix: ""
            env_prefix: ""
          - workspace: frontend
            image: diagnosticar-frontend
            suffix: "-staging"
            env_prefix: "STAGING_"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}${{ matrix.suffix }}
          tags: |
            # ops/deploy.sh and ops/staging.sh pass the git tag verbatim
            # ("v0.1.0"), but {{version}} strips the leading v and publishes
            # "0.1.0". Without the raw tag below, every pull on the node 404s on
            # an image that was built and published perfectly.
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Choose which set of public URLs gets compiled into this image. The
      # staging variant reads STAGING_NEXT_PUBLIC_*; everything else reads the
      # production ones. Selecting here rather than in the build-args block
      # keeps that block a single source of truth for both the scan build and
      # the push build, which must be byte-identical.
      - id: urls
        env:
          PROD_API: ${{ vars.NEXT_PUBLIC_API_URL }}
          PROD_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          PROD_HPO: ${{ vars.NEXT_PUBLIC_HPO_API_URL }}
          PROD_GENPHEN: ${{ vars.NEXT_PUBLIC_GENPHENAI_URL }}
          STG_API: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
          STG_API_BASE: ${{ vars.STAGING_NEXT_PUBLIC_API_BASE_URL }}
          STG_HPO: ${{ vars.STAGING_NEXT_PUBLIC_HPO_API_URL }}
          STG_GENPHEN: ${{ vars.STAGING_NEXT_PUBLIC_GENPHENAI_URL }}
          IS_STAGING: ${{ matrix.suffix == '-staging' }}
        run: |
          if [ "$IS_STAGING" = "true" ]; then
            api="$STG_API"; api_base="$STG_API_BASE"; hpo="$STG_HPO"; genphen="$STG_GENPHEN"
            # A staging image built with production's URLs would silently post
            # every request to production. Fail loudly instead.
            for v in "$api" "$api_base" "$hpo" "$genphen"; do
              if [ -z "$v" ]; then
                echo "::error::STAGING_NEXT_PUBLIC_* repository variables are not set."
                exit 1
              fi
            done
          else
            api="$PROD_API"; api_base="$PROD_API_BASE"; hpo="$PROD_HPO"; genphen="$PROD_GENPHEN"
          fi
          {
            echo "api=$api"
            echo "api_base=$api_base"
            echo "hpo=$hpo"
            echo "genphen=$genphen"
          } >> "$GITHUB_OUTPUT"
          echo "building for: ${IS_STAGING:+staging}${IS_STAGING:-production} -> $api"

      # Build into the local daemon first. Pushing before the scan would put a
      # vulnerable image on the registry and only then fail the job, leaving a
      # tag that nodo0 could pull.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.workspace }}
          push: false
          load: true
          tags: ${{ matrix.image }}${{ matrix.suffix }}:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.workspace }}${{ matrix.suffix }}
          # NEXT_PUBLIC_* values are baked into the client bundle at build time,
          # so the public URLs must be supplied here, not at container start.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.urls.outputs.api }}
            NEXT_PUBLIC_API_BASE_URL=${{ steps.urls.outputs.api_base }}
            NEXT_PUBLIC_HPO_API_URL=${{ steps.urls.outputs.hpo }}
            NEXT_PUBLIC_GENPHENAI_URL=${{ steps.urls.outputs.genphen }}
            RELEASE_VERSION=${{ github.ref_name }}
            RELEASE_COMMIT=${{ github.sha }}
            RELEASE_BUILT_AT=${{ steps.stamp.outputs.built_at }}

      - name: Scan the candidate image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}${{ matrix.suffix }}:candidate
          format: table
          exit-code: "1"
          ignore-unfixed: true
          # Matches the CI gate. Releasing at a looser threshold than CI would
          # let a HIGH that blocked every pull request ship in a release.
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Assert the image does not run as root
        run: |
          user=$(docker image inspect ${{ matrix.image }}${{ matrix.suffix }}:candidate --format '{{.Config.User}}')
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::${{ matrix.image }}${{ matrix.suffix }} runs as root; add a USER directive to its Dockerfile."
            exit 1
          fi
          echo "ok — runs as $user"

      # Only now, with a scanned image, publish it. Re-running the build is
      # free: every layer is already in the local cache.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.workspace }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.workspace }}${{ matrix.suffix }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.urls.outputs.api }}
            NEXT_PUBLIC_API_BASE_URL=${{ steps.urls.outputs.api_base }}
            NEXT_PUBLIC_HPO_API_URL=${{ steps.urls.outputs.hpo }}
            NEXT_PUBLIC_GENPHENAI_URL=${{ steps.urls.outputs.genphen }}
            RELEASE_VERSION=${{ github.ref_name }}
            RELEASE_COMMIT=${{ github.sha }}
            RELEASE_BUILT_AT=${{ steps.stamp.outputs.built_at }}

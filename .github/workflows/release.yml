name: Release

# Publishes immutable images to GHCR on a version tag. The nodes never run a
# build: nodo0 pulls a digest that CI already tested, so a deploy cannot pick up
# a half-finished commit and there is always a previous digest to roll back to.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to release
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & publish ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Without this, one image failing cancels the other mid-push and the
      # release is left half-published — the frontend on the registry and the
      # backend absent, or the reverse.
      fail-fast: false
      matrix:
        include:
          - workspace: frontend
            image: diagnosticar-frontend
          - workspace: backend
            image: diagnosticar-backend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # Build into the local daemon first. Pushing before the scan would put a
      # vulnerable image on the registry and only then fail the job, leaving a
      # tag that nodo0 could pull.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.workspace }}
          push: false
          load: true
          tags: ${{ matrix.image }}:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.workspace }}
          # NEXT_PUBLIC_* values are baked into the client bundle at build time,
          # so the public URLs must be supplied here, not at container start.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_HPO_API_URL=${{ vars.NEXT_PUBLIC_HPO_API_URL }}
            NEXT_PUBLIC_GENPHENAI_URL=${{ vars.NEXT_PUBLIC_GENPHENAI_URL }}

      - name: Scan the candidate image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:candidate
          format: table
          exit-code: "1"
          ignore-unfixed: true
          # Matches the CI gate. Releasing at a looser threshold than CI would
          # let a HIGH that blocked every pull request ship in a release.
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Assert the image does not run as root
        run: |
          user=$(docker image inspect ${{ matrix.image }}:candidate --format '{{.Config.User}}')
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::${{ matrix.image }} runs as root; add a USER directive to its Dockerfile."
            exit 1
          fi
          echo "ok — runs as $user"

      # Only now, with a scanned image, publish it. Re-running the build is
      # free: every layer is already in the local cache.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.workspace }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.workspace }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_HPO_API_URL=${{ vars.NEXT_PUBLIC_HPO_API_URL }}
            NEXT_PUBLIC_GENPHENAI_URL=${{ vars.NEXT_PUBLIC_GENPHENAI_URL }}

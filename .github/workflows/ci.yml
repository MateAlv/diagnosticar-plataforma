name: CI

# Not on push to main. main only accepts a pull request that is up to date with
# it and passed every check below, and merges squash it, so the commit that
# lands has exactly the tree that was tested. Re-running the suite on that push
# found nothing and cost about a quarter of the account's Actions minutes.
# workflow_dispatch runs it on main by hand when that is wanted.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Vulnerabilities appear without anyone pushing; check every Monday 06:00 UTC.
    - cron: "0 6 * * 1"

# Cancel superseded runs on the same branch — the node is small and PRs are chatty.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # --------------------------------------------------------------------------
  # Whether the pull request touches anything the slow jobs test. A change
  # only to documentation or to the cloud copy's infrastructure (infra/cloud/,
  # which only the `infra` job exercises) skips the backend suite, E2E, the
  # image builds and the stack smoke test: about 20 of a run's 22 billed
  # minutes. The skipped jobs
  # still report, as skipped, which satisfies the required checks.
  # The weekly run looks for newly published vulnerabilities, which only the
  # audit (Checks) and the image scans can find, so it skips the test suites.
  # --------------------------------------------------------------------------
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      tests: ${{ steps.diff.outputs.tests }}
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          infra=true
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename')
            printf '%s\n' "$files"
            # Anything outside these paths counts as code; workflow changes
            # always do, since they change what CI itself runs.
            if ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^infra/cloud/|^LICENSE$|^\.gitignore$)'; then
              code=false
            fi
            # The cloud stack embeds ops/seed-admin.sh.
            printf '%s\n' "$files" | grep -qE '^(infra/cloud/|ops/seed-admin\.sh$|\.github/workflows/ci\.yml$)' || infra=false
          fi
          tests=$code
          [ "$EVENT" = schedule ] && tests=false
          echo "code=$code tests=$tests infra=$infra"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Everything that takes seconds, in one job: lint and types, frontend unit
  # tests, dependency audit and secret scan. As six jobs each was billed a full
  # minute and repeated the checkout and install; together they take about as
  # long as E2E's install alone, so nothing waits longer. Every step runs even
  # when an earlier one failed, so one run still reports every failure.
  # --------------------------------------------------------------------------
  checks:
    name: Checks
    runs-on: ubuntu-latest
    # gitleaks-action asks the API which commits a pull request contains, which
    # `contents: read` alone does not cover ("Resource not accessible by
    # integration", only ever on PRs).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # `npm ci` fails when a lockfile has drifted from package.json, so the
      # audit below examines the tree that actually gets built.
      - id: install-frontend
        name: Install (frontend)
        working-directory: frontend
        run: npm ci
      - id: install-backend
        name: Install (backend)
        if: ${{ !cancelled() }}
        working-directory: backend
        run: npm ci

      - name: Lint & typecheck (frontend)
        if: ${{ !cancelled() && steps.install-frontend.outcome == 'success' }}
        working-directory: frontend
        run: npm run lint && npm run typecheck
      - name: Lint & typecheck (backend)
        if: ${{ !cancelled() && steps.install-backend.outcome == 'success' }}
        working-directory: backend
        run: npm run lint && npm run typecheck
      - name: Frontend unit tests
        if: ${{ !cancelled() && steps.install-frontend.outcome == 'success' }}
        working-directory: frontend
        run: npm test

      # Runtime dependencies gate the build; dev-only findings are reported
      # but never block, since they never reach the deployed image.
      - name: Dependency audit (frontend)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (backend)
        if: ${{ !cancelled() }}
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Dev dependency audit (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          (cd frontend && npm audit --audit-level=high)
          (cd backend && npm audit --audit-level=high)

      - name: Secret scan (gitleaks)
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert no .env file is tracked
        # .env holds the JWT secrets and the SMTP password.
        if: ${{ !cancelled() }}
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.[A-Za-z0-9_-]+)*$' | grep -v '\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Environment files are committed: $tracked"
            exit 1
          fi
          echo "ok — no .env files tracked"

  # --------------------------------------------------------------------------
  # The provider-neutral cloud deployment (infra/cloud/): about a minute, and
  # only when it changed. It cannot boot a machine here, so it checks what can
  # be checked without one: Terraform formatting and validity of the shared
  # module and of every adapter, the scripts, the compose file, and the
  # rendered cloud-init against cloud-init's own schema.
  # --------------------------------------------------------------------------
  infra:
    name: Cloud infrastructure
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive -diff infra/cloud

      # Every adapter validates without credentials or a backend.
      - name: Terraform validate (every adapter)
        run: |
          set -euo pipefail
          for dir in infra/cloud/providers/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Shell scripts
        run: shellcheck -x infra/cloud/stack/diagnosticar.sh infra/cloud/scripts/remote.sh

      - name: Compose file
        run: |
          cat > "$RUNNER_TEMP/ci.env" <<'ENV'
          DOMAIN='ci.example'
          POSTGRES_PASSWORD='ci'
          JWT_ACCESS_SECRET='ci'
          JWT_REFRESH_SECRET='ci'
          JWT_ACCESS_PRIVATE_KEY='ci'
          JWT_ACCESS_PUBLIC_KEY='ci'
          GLOBAL_EXTRACTIONS_PER_WEEK='1'
          GLOBAL_EXTRACTIONS_PER_5H='1'
          BACKEND_IMAGE='ci/backend'
          FRONTEND_IMAGE='ci/frontend'
          RECOGNIZER_IMAGE='ci/recognizer'
          MODEL_IMAGE='ci/model'
          ENV
          docker compose -f infra/cloud/stack/docker-compose.yml --env-file "$RUNNER_TEMP/ci.env" config -q

      # The same document every provider receives, rendered with a throwaway
      # key, then checked by cloud-init itself and against the size limits.
      - name: Rendered cloud-init
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/ci_key"
          terraform -chdir=infra/cloud/providers/manual apply -auto-approve -input=false \
            -var "ssh_public_key_path=$RUNNER_TEMP/ci_key.pub"
          sudo apt-get install -y -q --no-install-recommends cloud-init >/dev/null
          cloud-init schema --config-file infra/cloud/providers/manual/cloud-init.yaml
          echo "plain: $(wc -c < infra/cloud/providers/manual/cloud-init.yaml) bytes (limit 32768)"
          echo "gzip:  $(gzip -9c infra/cloud/providers/manual/cloud-init.yaml | wc -c) bytes (limit 16384)"

  # --------------------------------------------------------------------------
  # Backend suite against a real Postgres. The ownership tests here are the ones
  # that prove one family cannot read another family's clinical records, so they
  # must run against the genuine schema and genuine SQL — not a mock.
  # --------------------------------------------------------------------------
  backend-tests:
    name: Backend tests (Postgres)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diagnosticar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/diagnosticar_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - name: Unit + integration tests
        run: npm test

      - name: Fail if the integration tests silently skipped
        # They self-skip when Postgres is unreachable, which is right locally and
        # dangerous in CI — a broken service container would look like a pass.
        run: |
          npm run build
          output=$(node --test "tests/api-*.test.mjs" 2>&1) || { echo "$output"; exit 1; }
          if echo "$output" | grep -q "# skipped [1-9]"; then
            echo "$output"
            echo "::error::Integration tests skipped in CI — the Postgres service is not reachable."
            exit 1
          fi
          echo "$output" | tail -12

  # --------------------------------------------------------------------------
  # Browser tests against the standalone build — the artifact the image ships.
  # The HPO and GenPhenAI services on brainy are stubbed; CI has no route to
  # them and no GPU.
  # --------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Container images: build both, then scan the filesystem of each for known
  # CVEs in OS packages and bundled node_modules.
  # --------------------------------------------------------------------------
  # Gated per step rather than per job: a matrix job skipped as a whole
  # reports a check without the matrix values in its name, which never matches
  # the required "Build & scan images (frontend, …)" and blocks the merge.
  images:
    name: Build & scan images
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: frontend
            image: diagnosticar-frontend
          - workspace: backend
            image: diagnosticar-backend
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - if: needs.changes.outputs.code == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: needs.changes.outputs.code == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.workspace }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.workspace }}
          cache-to: type=gha,mode=max,scope=${{ matrix.workspace }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://example.invalid/api
            NEXT_PUBLIC_API_BASE_URL=https://example.invalid/api
            NEXT_PUBLIC_HPO_API_URL=https://example.invalid/hpo-api
            NEXT_PUBLIC_GENPHENAI_URL=https://example.invalid/genphenai

      - name: Scan image for known vulnerabilities
        if: needs.changes.outputs.code == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Assert the image does not run as root
        if: needs.changes.outputs.code == 'true'
        run: |
          user=$(docker image inspect ${{ matrix.image }}:ci --format '{{.Config.User}}')
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::${{ matrix.image }} runs as root; add a USER directive to its Dockerfile."
            exit 1
          fi
          echo "ok — runs as $user"

  # --------------------------------------------------------------------------
  # Boots the whole stack the way the node does and drives the real endpoints.
  # --------------------------------------------------------------------------
  stack-smoke:
    name: Compose stack smoke test
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write a CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=diagnosticar
          POSTGRES_PASSWORD=ci-only-password
          POSTGRES_DB=diagnosticar
          DATABASE_URL=postgresql://diagnosticar:ci-only-password@db:5432/diagnosticar
          JWT_ACCESS_SECRET=ci-access-secret-that-is-at-least-32-chars
          JWT_REFRESH_SECRET=ci-refresh-secret-that-is-at-least-32-chars
          FRONTEND_URL=http://localhost:3000
          BACKEND_URL=http://localhost:4000
          NODE_ENV=production
          EOF

      - name: Validate the production compose files parse
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null

      - name: Start the stack
        run: docker compose up --build -d db backend frontend

      - name: Wait for the backend to report healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/health | grep -q '"status":"ok"'; then
              echo "backend healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend never became healthy"
          docker compose logs backend db
          exit 1

      - name: Wait for the frontend to serve
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/home && { echo "frontend up after ${i}s"; exit 0; }
            sleep 1
          done
          echo "::error::frontend never served /home"
          docker compose logs frontend
          exit 1

      - name: Migrations are idempotent across a restart
        # migrate() runs on every boot; a non-idempotent statement would break
        # the second deploy rather than the first.
        run: |
          docker compose restart backend
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4000/health | grep -q '"status":"ok"' && exit 0
            sleep 1
          done
          echo "::error::backend failed to restart — migrations may not be idempotent"
          docker compose logs backend
          exit 1

      - name: Anonymous callers cannot reach patient data
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/api/patients)
          [ "$code" = "401" ] || { echo "::error::GET /api/patients returned $code, expected 401"; exit 1; }
          echo "ok — 401 without a token"

      - name: Frontend serves its security headers
        run: |
          headers=$(curl -sI http://127.0.0.1:3000/home)
          echo "$headers"
          fail=0
          for h in X-Frame-Options X-Content-Type-Options Referrer-Policy Permissions-Policy Strict-Transport-Security; do
            echo "$headers" | grep -qi "^$h:" && echo "ok   $h" || { echo "FAIL missing $h"; fail=1; }
          done
          echo "$headers" | grep -qi "^X-Powered-By:" && { echo "FAIL X-Powered-By exposed"; fail=1; } || echo "ok   X-Powered-By absent"
          exit $fail

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

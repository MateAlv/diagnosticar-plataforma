name: CodeQL

# Static analysis for the classes of bug the test suite cannot reach by
# construction: injection sinks, unsafe deserialisation, missing authorisation
# checks on a newly added route, and hard-coded credentials.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Rules improve over time; re-scan unchanged code weekly.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended adds the lower-confidence security rules; worth the
          # extra noise for an app holding health data.
          queries: security-extended

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

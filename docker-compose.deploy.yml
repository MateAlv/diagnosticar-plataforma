# Pull-based deploy overlay for nodo0.
#
# The base compose file builds from source, which is right for a laptop and
# wrong for the node: building on nodo0 competes with the running site for CPU
# and can produce an image that no CI run ever tested. This overlay points each
# service at an immutable tag published by .github/workflows/release.yml, so a
# deploy is "pull a digest that already passed CI, then restart".
#
# Staging uses it through `ops/staging.sh up vX.Y.Z`, which ops/deploy.sh runs
# for each new release:
#   docker compose -p diagnosticar-staging --env-file .env.staging \
#     -f docker-compose.yml -f docker-compose.staging.yml \
#     -f docker-compose.deploy.yml pull
#   docker compose ... up -d --no-build

services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-matealv}/diagnosticar-backend:${RELEASE_TAG:?RELEASE_TAG must be set}
    pull_policy: always

  frontend:
    # FRONTEND_IMAGE lets staging select its own build without depending on
    # compose overlay ordering. NEXT_PUBLIC_* values are compiled in at build
    # time, so staging genuinely needs a different image, not different config.
    image: ghcr.io/${GHCR_OWNER:-matealv}/${FRONTEND_IMAGE:-diagnosticar-frontend}:${RELEASE_TAG:?RELEASE_TAG must be set}
    pull_policy: always

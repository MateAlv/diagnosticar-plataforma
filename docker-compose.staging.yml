# Staging stack for nodo0 — a full copy of production on the same node.
#
# Runs beside prod under a separate compose project (see ops/staging.sh), with
# its own database volume and its own Traefik host, so nothing here can touch a
# real family's records. It shares brainy's HPO/GenPhenAI services through the
# same reverse SSH tunnels, which is the point: it is the only place the real
# model services get exercised before production does.
#
# Rule: synthetic data only. Never restore a production dump into staging —
# that would put clinical data on a host with weaker access control.

services:
  db:
    restart: unless-stopped
    # Distinct volume name; a shared volume would let a staging migration
    # corrupt production data.
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    ports: !reset []

  backend:
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      # Staging issues its own tokens; a cookie from staging must never
      # authenticate against production.
      JWT_ACCESS_SECRET: ${STAGING_JWT_ACCESS_SECRET:?set STAGING_JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${STAGING_JWT_REFRESH_SECRET:?set STAGING_JWT_REFRESH_SECRET}
      # RS256, so hpo-recognizer can verify a session with the public key
      # alone. Unset, the backend keeps signing HS256 exactly as before.
      JWT_ACCESS_PRIVATE_KEY: ${STAGING_JWT_ACCESS_PRIVATE_KEY:-}
      JWT_ACCESS_PUBLIC_KEY: ${STAGING_JWT_ACCESS_PUBLIC_KEY:-}
      JWT_ACCEPT_LEGACY_HS256: ${STAGING_JWT_ACCEPT_LEGACY_HS256:-false}
      FRONTEND_URL: https://${STAGING_HOST:?set STAGING_HOST}
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-internal-nodo0-web}"
      - "traefik.http.services.diagnosticar-staging-backend.loadbalancer.server.port=4000"
      - "traefik.http.routers.diagnosticar-staging-backend.rule=Host(`${STAGING_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.diagnosticar-staging-backend.entrypoints=websecure"
      - "traefik.http.routers.diagnosticar-staging-backend.tls=true"
      - "traefik.http.routers.diagnosticar-staging-backend.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-leresolver}"
      - "traefik.http.routers.diagnosticar-staging-backend.priority=220"
      # Staging is not for the public. Basic auth keeps it out of search results
      # and away from families who might mistake it for the real service.
    networks:
      - default
      - traefik_net

  frontend:
    restart: unless-stopped
    init: true
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-internal-nodo0-web}"
      - "traefik.http.services.diagnosticar-staging-frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.diagnosticar-staging-frontend.rule=Host(`${STAGING_HOST}`)"
      - "traefik.http.routers.diagnosticar-staging-frontend.entrypoints=websecure"
      - "traefik.http.routers.diagnosticar-staging-frontend.tls=true"
      - "traefik.http.routers.diagnosticar-staging-frontend.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-leresolver}"
      - "traefik.http.routers.diagnosticar-staging-frontend.priority=100"
      - "traefik.http.routers.diagnosticar-staging-frontend.middlewares=diagnosticar-staging-noindex"
      - "traefik.http.middlewares.diagnosticar-staging-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"
    networks:
      - default
      - traefik_net

  # Bridges to brainy, reusing the SAME reverse SSH tunnel as production
  # (host ports 18100 and 18120). These are read-only inference calls and the
  # tunnel is a shared transport, so staging does not need its own — see
  # REVERSE_SSH_TUNNELS.md. Separate socat containers and separate Traefik
  # routers are still required, because the routers match on Host() and
  # production's only answer for DIAGNOSTICAR_HOST.
  hpo-tunnel:
    image: alpine/socat:1.8.0.1
    command:
      - "TCP-LISTEN:8000,fork,reuseaddr"
      - "TCP:host.docker.internal:18100"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-internal-nodo0-web}"
      - "traefik.http.services.diagnosticar-staging-hpo.loadbalancer.server.port=8000"
      - "traefik.http.routers.diagnosticar-staging-hpo.rule=Host(`${STAGING_HOST}`) && PathPrefix(`/hpo-api`)"
      - "traefik.http.routers.diagnosticar-staging-hpo.entrypoints=websecure"
      - "traefik.http.routers.diagnosticar-staging-hpo.tls=true"
      - "traefik.http.routers.diagnosticar-staging-hpo.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-leresolver}"
      - "traefik.http.routers.diagnosticar-staging-hpo.priority=230"
      # Basic auth here too: without it these paths are an unauthenticated
      # public route to the GPU node.
      - "traefik.http.routers.diagnosticar-staging-hpo.middlewares=diagnosticar-staging-hpo-strip"
      - "traefik.http.middlewares.diagnosticar-staging-hpo-strip.stripprefix.prefixes=/hpo-api"
    networks:
      - traefik_net

  genphenai-tunnel:
    image: alpine/socat:1.8.0.1
    command:
      - "TCP-LISTEN:18020,fork,reuseaddr"
      - "TCP:host.docker.internal:18120"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-internal-nodo0-web}"
      - "traefik.http.services.diagnosticar-staging-genphenai.loadbalancer.server.port=18020"
      - "traefik.http.routers.diagnosticar-staging-genphenai.rule=Host(`${STAGING_HOST}`) && PathPrefix(`/genphenai`)"
      - "traefik.http.routers.diagnosticar-staging-genphenai.entrypoints=websecure"
      - "traefik.http.routers.diagnosticar-staging-genphenai.tls=true"
      - "traefik.http.routers.diagnosticar-staging-genphenai.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-leresolver}"
      - "traefik.http.routers.diagnosticar-staging-genphenai.priority=230"
      - "traefik.http.routers.diagnosticar-staging-genphenai.middlewares=diagnosticar-staging-genphenai-strip"
      - "traefik.http.middlewares.diagnosticar-staging-genphenai-strip.stripprefix.prefixes=/genphenai"
    networks:
      - traefik_net

  # The Spanish symptom recognizer, answering /hpo-api/extract-hpo for staging
  # only. Production and staging otherwise share brainy's gateway through the
  # same tunnel, so switching the recognizer on there would switch it on for
  # production too.
  #
  # Only extraction moves: a router one priority above hpo-tunnel's takes that
  # one path, and search and specialties keep going to brainy. The router is
  # off until HPO_RECOGNIZER_ROUTED=true, so a deploy starts the container
  # without sending it traffic; check /healthz first, then route. Routing back
  # is the same variable set to false and `ops/staging.sh up` again — nothing
  # has to be stopped.
  #
  # No GPU: the LLM is remote and the encoder runs on CPU. The image is built
  # by the release workflow like the other two, from the gateway and
  # recognizer commits pinned in .github/recognizer.env, and carries the
  # release's tag. HPO_RECOGNIZER_TAG pins it separately, to roll the
  # recognizer back without rolling back the rest.
  hpo-recognizer:
    image: ghcr.io/${GHCR_OWNER:-matealv}/diagnosticar-hpo-recognizer:${HPO_RECOGNIZER_TAG:-${RELEASE_TAG:-latest}}
    restart: unless-stopped
    init: true
    environment:
      USE_RECOGNIZER: "true"
      RECOGNIZER_PROVIDER: claude-cli
      RECOGNIZER_MODEL: ${RECOGNIZER_MODEL:-claude-opus-5}
      # From `claude setup-token`: a long-lived subscription token. Kept in
      # .env.staging under ~<usuario>, never in /data, which every account
      # on the host can read.
      CLAUDE_CODE_OAUTH_TOKEN: ${STAGING_CLAUDE_CODE_OAUTH_TOKEN:-}
      # The incumbent pipeline still serves this container's health checks,
      # but never extraction here, so it needs no Ollama.
      ENABLE_SYMPTOM_EXTRACTION: "false"
      # No audit database on nodo0, and the record would hold the clinical
      # text itself.
      STORE_REQUESTS: "false"
      CACHE_ENABLED: "false"
      # Every call costs money, so an anonymous caller must not reach it.
      REQUIRE_AUTH: "true"
      JWT_PUBLIC_KEY: ${STAGING_JWT_ACCESS_PUBLIC_KEY:-}
      # Traefik's own address, not its network's CIDR: that network is shared
      # with other teams' containers, and trusting all of them lets any one
      # forge X-Forwarded-For. An exact IP that goes stale when Traefik is
      # recreated fails loudly instead — every caller shares one bucket and
      # starts seeing 429s.
      TRUSTED_PROXIES: ${STAGING_TRUSTED_PROXIES:-}
      RATE_LIMIT_PER_MINUTE: ${RECOGNIZER_RATE_LIMIT_PER_MINUTE:-10}
      MAX_CONCURRENT_EXTRACTIONS: ${RECOGNIZER_MAX_CONCURRENT:-2}
      USER_EXTRACTIONS_PER_HOUR: ${RECOGNIZER_USER_PER_HOUR:-20}
      USER_EXTRACTIONS_PER_DAY: ${RECOGNIZER_USER_PER_DAY:-60}
      # The ceiling on what staging may spend of the Claude subscription behind
      # STAGING_CLAUDE_CODE_OAUTH_TOKEN. Mate, 2026-09-28: 40 per 5 hours, and
      # the week is just that rate (40 x 168 / 5), so it adds no limit of its
      # own. Where 40 would exceed 15% of the subscription, 40 wins; STAGING.md
      # has how to measure which it is.
      GLOBAL_EXTRACTIONS_PER_5H: ${RECOGNIZER_GLOBAL_PER_5H:-40}
      GLOBAL_EXTRACTIONS_PER_WEEK: ${RECOGNIZER_GLOBAL_PER_WEEK:-1344}
      # On a volume, so a redeploy does not hand out a fresh week.
      EXTRACTION_BUDGET_STATE: /var/lib/recognizer/budget.json
    volumes:
      - staging_recognizer_state:/var/lib/recognizer
    labels:
      - "traefik.enable=${HPO_RECOGNIZER_ROUTED:-false}"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-internal-nodo0-web}"
      - "traefik.http.services.diagnosticar-staging-hpo-recognizer.loadbalancer.server.port=8000"
      - "traefik.http.routers.diagnosticar-staging-hpo-recognizer.rule=Host(`${STAGING_HOST}`) && Path(`/hpo-api/extract-hpo`)"
      - "traefik.http.routers.diagnosticar-staging-hpo-recognizer.entrypoints=websecure"
      - "traefik.http.routers.diagnosticar-staging-hpo-recognizer.tls=true"
      - "traefik.http.routers.diagnosticar-staging-hpo-recognizer.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-leresolver}"
      - "traefik.http.routers.diagnosticar-staging-hpo-recognizer.priority=240"
      - "traefik.http.routers.diagnosticar-staging-hpo-recognizer.middlewares=diagnosticar-staging-hpo-recognizer-strip"
      - "traefik.http.middlewares.diagnosticar-staging-hpo-recognizer-strip.stripprefix.prefixes=/hpo-api"
    networks:
      - traefik_net

  # GenPhenAI with the GenPhenia model inside, answering /genphenai for staging
  # only. genphenai-tunnel reaches brainy's GenPhenAI, which production uses
  # through the same tunnel, so staging gets its own instead of changing that
  # one. The model is the same checkpoint brainy serves (model-v3.0.0 of
  # diagnostic.ar-model, baked into the image), so rankings do not change.
  #
  # A router one priority above genphenai-tunnel's takes the whole path once
  # MODEL_ROUTED=true; until then the container runs and nothing reaches
  # it. Routing back is the same variable set to false and `ops/staging.sh up`.
  #
  # No GPU and no secret: ONNX on the CPU, ~90 MiB, a few ms per ranking.
  # MODEL_IMAGE_TAG pins it separately, to roll it back without the rest.
  model:
    image: ghcr.io/${GHCR_OWNER:-matealv}/diagnosticar-model:${MODEL_IMAGE_TAG:-${RELEASE_TAG:-latest}}
    restart: unless-stopped
    init: true
    environment:
      CORS_ORIGINS: https://${STAGING_HOST}
    labels:
      - "traefik.enable=${MODEL_ROUTED:-false}"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-internal-nodo0-web}"
      - "traefik.http.services.diagnosticar-staging-model.loadbalancer.server.port=18020"
      - "traefik.http.routers.diagnosticar-staging-model.rule=Host(`${STAGING_HOST}`) && PathPrefix(`/genphenai`)"
      - "traefik.http.routers.diagnosticar-staging-model.entrypoints=websecure"
      - "traefik.http.routers.diagnosticar-staging-model.tls=true"
      - "traefik.http.routers.diagnosticar-staging-model.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-leresolver}"
      - "traefik.http.routers.diagnosticar-staging-model.priority=240"
      - "traefik.http.routers.diagnosticar-staging-model.middlewares=diagnosticar-staging-model-strip"
      - "traefik.http.middlewares.diagnosticar-staging-model-strip.stripprefix.prefixes=/genphenai"
    networks:
      - traefik_net
      # For question-agent, which stays off the shared network.
      - default

  # Follow-up questions, called only by the backend. Deliberately not on
  # traefik_net and without labels: that network is shared with other teams'
  # containers, and every call here spends LLM quota. The backend reaches it on
  # the project's default network, and the internal token is checked on top.
  #
  # Behind the question-agent profile, so `ops/staging.sh up` neither pulls nor
  # starts it until the image exists:
  #   COMPOSE_PROFILES=question-agent ops/staging.sh up vX.Y.Z
  # plus QUESTION_AGENT_URL=http://question-agent:8010 in .env.staging.
  question-agent:
    image: ghcr.io/${GHCR_OWNER:-matealv}/diagnosticar-question-agent:${QUESTION_AGENT_TAG:-${RELEASE_TAG:-latest}}
    profiles: ["question-agent"]
    restart: unless-stopped
    init: true
    # The rest of its PREGUNTAS_* settings, and the healthcheck, come from
    # docker-compose.yml.
    environment:
      PREGUNTAS_MODEL_SERVICE_URL: http://model:18020
      # The same subscription token as hpo-recognizer; see its note above.
      CLAUDE_CODE_OAUTH_TOKEN: ${STAGING_CLAUDE_CODE_OAUTH_TOKEN:-}
    extra_hosts: !reset []
    networks:
      - default

networks:
  traefik_net:
    external: true
    name: ${TRAEFIK_NETWORK:-internal-nodo0-web}

volumes:
  staging_postgres_data:
  staging_recognizer_state:
